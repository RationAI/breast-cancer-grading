# @package _global_

url: "http://rayservice-qc-update-trial-serve-svc.rationai-jobs-ns.svc.cluster.local:8000/"

# Concurrency settings
request_limit: 4

# Timeout settings (in seconds)
request_timeout: 36000

# Quality check flags
check_residual: true
check_folding: true
check_blur: true

# Pre-computed tissue masks (avoids redundant single-threaded computation in service)
tissue_mask_dir: ${project_path}/tissue_masks
# MLflow artifact URI to download tissue masks from (if not already local)
tissue_mask_artifact_uri: mlflow-artifacts:/82/b42693221ada416aaf8c67ca61c01810/artifacts/tissue_masks  # e.g. "runs:/<run_id>/tissue_masks"

# Output directory for QC masks
output_path: ${project_path}/qc_masks

metadata:
  run_name: BRC Grading QC Masks
  description: "Quality control processing for grading slides"
  hyperparams:
    check_residual: ${check_residual}
    check_folding: ${check_folding}
    check_blur: ${check_blur}
