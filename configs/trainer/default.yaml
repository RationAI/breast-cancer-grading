_target_: rationai.mlkit.Trainer

max_epochs: 100
log_every_n_steps: 1
accelerator: auto
devices: auto

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: valid/loss
    mode: min
    # 10 idle epochs cost ~40 % of every wave: the best epoch was 0-5 in all ten fold runs,
    # then each run waited out the full patience before stopping at epoch 15-28. Five is above
    # every observed gap between the best epoch and the stop, and it cannot move best.ckpt,
    # which is chosen by val loss.
    patience: 5
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: valid/loss
    mode: min
    save_top_k: 1
    filename: best
    dirpath: ${checkpoints_dir}
    save_last: true  # only rewritten when valid/loss improves (Lightning gates it)
  resume_point:
    # Preemption insurance: Lightning rewrites ``last.ckpt`` only on improvement,
    # so after a plateau it can be many epochs stale. This one saves unconditionally
    # every epoch to a fixed path, overwriting itself (one 32 MB file rolling).
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${checkpoints_dir}
    filename: resume
    save_top_k: 1
    every_n_epochs: 1
    enable_version_counter: false  # overwrite resume.ckpt in place, no resume_v1.ckpt pile-up
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  provenance:
    _target_: rationai.provenance.lightning.ProvenanceCallback
    fail_fast: true  # abort training if the disk no longer matches the registration
    dataset_run_id: ${dataset.run_id}
    split_uris: ${dataset.split_uris}  # referenced, not recomputed
    test_size: 0  # splits live in the `split` column of labels.csv; default 0.2 would silently re-split
