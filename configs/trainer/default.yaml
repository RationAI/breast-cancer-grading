_target_: rationai.mlkit.Trainer

max_epochs: 100
log_every_n_steps: 1
accelerator: auto
devices: auto

callbacks:
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: valid/loss
    mode: min
    patience: 10
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: valid/loss
    mode: min
    save_top_k: 1
    filename: best
    dirpath: ${checkpoints_dir}
    save_last: true  # last.ckpt = resume point (epoch, optimizer, scheduler state)
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: epoch
  provenance:
    _target_: rationai.provenance.lightning.ProvenanceCallback
    fail_fast: true  # abort training if the disk no longer matches the registration
    dataset_run_id: ${dataset.run_id}
    split_uris: ${dataset.split_uris}  # referenced, not recomputed
    test_size: 0  # splits live in the `split` column of labels.csv; default 0.2 would silently re-split
