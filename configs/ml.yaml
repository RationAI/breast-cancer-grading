defaults:
  - base
  - _self_

seed: ${random_seed:}

mode: fit  # fit | validate | test | predict
checkpoint: null  # path to a .ckpt to resume (fit) or load weights (validate/test/predict)

# After a `fit` run, evaluate the best checkpoint on the test split so models are
# directly comparable on held-out data right after training. Ignored unless mode=fit.
test_after_fit: true

# Task shape — 4-class Nottingham grading: 0 = no tumour epithelium (negative
# slide), 1 = G1 (well differentiated), 2 = G2 (moderately), 3 = G3 (poorly).
num_classes: 4
feature_dim: ???  # tile-feature width = encoder.out_dim; set per experiment

# Provenance — paste the values the registration printed (see README,
# "Provenance"). Left null, training runs unverified (best effort).
dataset:
  # Run that produced and archived the embeddings (mlflow exp 82, all 1735
  # per-slide parquets as artifacts) — the provenance pointer for training.
  # Byte-level verification stays off: it only runs when a manifest.csv is found
  # next to the training cwd, and the embeddings live in MLflow instead.
  run_id: 96532a9ff29241e4b65d57dbc379e944
  split_uris: null   # splits come from the `split` column of labels.csv (BRC-A-20)
