# @package _global_
# Real bc20-24 grading data — per-slide Virchow2 embeddings from
# preprocessing/embeddings.py + a labels CSV (see README, "Labels").
dataset:
  name: bc20-24
  paths:
    # Same ${project_path} the preprocessing runs wrote to (see configs/base.yaml).
    embeddings_dir: ${project_path}/embeddings/${dataset.name}
    labels: ${project_path}/labels.csv

datamodule:
  _target_: ml.data.DataModule
  # Reading + decoding one slide parquet (~0.4 s for a median 64 MB bag) dominates
  # the GPU step, so throughput scales with dataloader workers. Host RAM grows with
  # batch_size * num_workers (bags in flight: median 61 MB, p90 144 MB, max 336 MB)
  # plus the per-worker bag cache below — raise run_train.py's memory along with these.
  batch_size: 8
  num_workers: 8
  persistent_workers: true
  class_balanced: true
  train: &dataset
    _target_: ml.data.datasets.GradingDataset
    embeddings_dir: ${dataset.paths.embeddings_dir}
    labels_csv: ${dataset.paths.labels}
    split: train
    # fp16 bag cache, per worker process (shared by all three splits). The training
    # split is ~7.8 GB of fp16 bags over 8 workers ≈ 1 GB each, so 3 GB covers train,
    # val and test without eviction and epochs after the first read no NAS at all.
    cache_mb: 3072
    # Whole bags. Measured tiles/slide over the cohort: p25 2.3k, median 6.5k, p75 12.3k,
    # max 27k — and strongly class-correlated (c0 median 2.5k vs 9-11k for the tumour
    # grades), so sub-sampling to a fixed 2048 truncated the three hard classes to ~20 %
    # while leaving c0 nearly intact, which leaks the label through bag size (log tile
    # count alone scores 0.579 raw accuracy / 0.509 QWK on test) and did not match the
    # full-bag val/test loaders at all. null costs ~4x tiles per step.
    max_tiles: null
  val:
    <<: *dataset
    split: val
    max_tiles: null  # evaluation always sees the whole slide
  test:
    <<: *dataset
    split: test
    max_tiles: null
