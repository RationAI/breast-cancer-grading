# @package _global_
# Real bc20-24 grading data — per-slide Virchow2 embeddings from
# preprocessing/embeddings.py + a labels CSV (see README, "Labels").
dataset:
  name: bc20-24
  paths:
    # Same ${project_path} the preprocessing runs wrote to (see configs/base.yaml).
    embeddings_dir: ${project_path}/embeddings/${dataset.name}
    labels: ${project_path}/labels.csv

datamodule:
  _target_: ml.data.DataModule
  # Reading + decoding one slide parquet (~0.5 s for a median 61 MB bag) dominates
  # the GPU step (~10 ms), so throughput scales with dataloader workers. Host RAM
  # grows with batch_size * num_workers (bags in flight: median 61 MB, p90 144 MB,
  # max 336 MB) — raise run_train.py's memory along with these two.
  batch_size: 8
  num_workers: 8
  persistent_workers: true
  class_balanced: true
  train: &dataset
    _target_: ml.data.datasets.GradingDataset
    embeddings_dir: ${dataset.paths.embeddings_dir}
    labels_csv: ${dataset.paths.labels}
    split: train
    # Bag augmentation + cost control: 2048 of ~7k tiles per slide, resampled each
    # epoch. The model overfit (train acc 0.92 / val 0.79, flat from epoch ~5), so
    # this is regularization first and a ~3x I/O saving second.
    max_tiles: 2048
  val:
    <<: *dataset
    split: val
    max_tiles: null  # evaluation always sees the whole slide
  test:
    <<: *dataset
    split: test
    max_tiles: null
