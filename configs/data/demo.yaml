# @package _global_
# Synthetic 4-class embedding bags — verify the training pipeline on CPU.
# Generated by `uv run python scripts/make_demo_data.py`.
dataset:
  name: demo
  paths:
    embeddings_dir: data/demo/embeddings
    labels: data/demo/labels.csv

datamodule:
  _target_: ml.data.DataModule
  batch_size: 8
  num_workers: 0
  class_balanced: true
  train: &dataset
    _target_: ml.data.datasets.GradingDataset
    embeddings_dir: ${dataset.paths.embeddings_dir}
    labels_csv: ${dataset.paths.labels}
    split: train
  val:
    <<: *dataset
    split: val
  test:
    <<: *dataset
    split: test
